<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>juki2023 base</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #app { border: 0; width: 100%; height: 100%; display: block; }
  #bar { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10;
         display: none; max-width: calc(100% - 24px); padding: 10px 16px; border-radius: 24px; border: 1px solid #00e676;
         background: #004d40; color: #fff; font: 14px/1.4 system-ui, sans-serif; text-align: center; box-shadow: 0 4px 16px #000a; }
  #bar button { all: unset; cursor: pointer; font-weight: bold; color: #00e676; }
  #bar small { display: block; color: #bbb; margin-top: 4px; }
</style>
</head>
<body>
<iframe id="app" allow="autoplay *; fullscreen *; clipboard-write; encrypted-media *; picture-in-picture *" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="bar"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="config.js"></script>
<script>
(function() {
  var C = self.APP_CONFIG || {};
  var frame = document.getElementById('app');
  var bar = document.getElementById('bar');
  var current = '';          // いま iframe に渡している通知トークン
  var reg = null, messaging = null;

  function say(html) { bar.innerHTML = html; bar.style.display = html ? 'block' : 'none'; }
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
  function configured() { return C.firebase && C.firebase.apiKey && C.firebase.messagingSenderId && C.vapidKey; }

  // アプリ本体を開く。通知トークンがあれば、URLの ?pt= に付けて渡す(本体がそれを読んでサーバーに登録する)
  function load(token) {
    if (token === current && frame.src) return;
    current = token || '';
    try {
      var u = new URL(C.gasUrl);
      if (current) u.searchParams.set('pt', current);
      frame.src = u.toString();
    } catch (e) { say('config.js の gasUrl を確認してください'); }
  }

  async function fetchToken() {
    var t = await messaging.getToken({ vapidKey: C.vapidKey, serviceWorkerRegistration: reg });
    if (t) { try { localStorage.setItem('fcm_token', t); } catch (e) {} }
    return t || '';
  }

  async function enable() {
    say('許可を確認しています…');
    try {
      var perm = await Notification.requestPermission();
      if (perm !== 'granted') { say('通知がブロックされています。ブラウザ(端末)の設定で、このアプリの通知を許可してください'); return; }
      var t = await fetchToken();
      if (!t) { say('通知の準備に失敗しました。時間をおいてもう一度試してください'); return; }
      say('');
      load(t);
    } catch (e) {
      say('通知の準備に失敗しました: ' + String(e && e.message || e).slice(0, 80));
    }
  }

  function offerButton() {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) { say(''); return; }
    if (isIOS() && !isStandalone()) {
      say('📲 通知を使うには、共有ボタン →「ホーム画面に追加」で追加して、そのアイコンから開いてください');
      return;
    }
    if (Notification.permission === 'denied') { say(''); return; }
    say('<button type="button" id="enable">🔔 通知をオンにする</button><small>アプリを閉じていてもメッセージが届きます</small>');
    document.getElementById('enable').onclick = enable;
  }

  async function boot() {
    var saved = '';
    try { saved = localStorage.getItem('fcm_token') || ''; } catch (e) {}
    // 以前に許可済みなら、すぐ本体を開く(トークンの更新は裏で確認する)
    load(('Notification' in window) && Notification.permission === 'granted' ? saved : '');

    if (!configured()) { say('config.js の Firebase の設定がまだです(SETUP.md を見てください)'); return; }
    if (!('serviceWorker' in navigator) || !('Notification' in window)) return;
    try {
      reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
      firebase.initializeApp(C.firebase);
      messaging = firebase.messaging();
    } catch (e) { say('通知の準備に失敗しました: ' + String(e && e.message || e).slice(0, 80)); return; }

    if (Notification.permission === 'granted') {
      try {
        var t = await fetchToken();
        if (t && t !== current) load(t); // トークンが変わっていたら、開き直す
        say('');
      } catch (e) { /* 次回に再挑戦 */ }
    } else {
      offerButton();
    }
  }
  boot();
})();
</script>
</body>
</html>
